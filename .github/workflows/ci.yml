name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The baseline is specification-only: no go.mod, no web/package.json. These
  # jobs skip cleanly until the first implementation lands, then do real work.
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no go.mod yet — skipping"; fi
      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: go build ./...
      - name: Vet
        if: steps.detect.outputs.present == 'true'
        run: go vet ./...
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: go test -race -count=1 ./...
      # Bounded fuzz of the ownership and SSE-recovery properties (#63). The fixed
      # corpora already ran in Test above; this explores around them for a short, fixed time.
      - name: Fuzz (bounded)
        if: steps.detect.outputs.present == 'true'
        timeout-minutes: 15
        run: make fuzz FUZZTIME=20s
      # tools/hermes-provisioner is a separate module: ./... from the root does not reach it (#50).
      - name: Build (provisioner module)
        if: steps.detect.outputs.present == 'true'
        working-directory: tools/hermes-provisioner
        run: go build ./...
      - name: Vet (provisioner module)
        if: steps.detect.outputs.present == 'true'
        working-directory: tools/hermes-provisioner
        run: go vet ./...
      - name: Test (provisioner module)
        if: steps.detect.outputs.present == 'true'
        working-directory: tools/hermes-provisioner
        run: go test -race -count=1 ./...

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no web/package.json yet — skipping"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci
        working-directory: web
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present
        working-directory: web
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm test
        working-directory: web
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build
        working-directory: web
      # The bundle is committed so `go build` needs no Node. A bundle that no
      # longer matches web/ is how stale artifacts come back: fail on any difference.
      - name: Committed bundle is up to date
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -n "$(git status --porcelain -- internal/webui)" ]; then
            git status --short -- internal/webui
            echo "::error::internal/webui/dist is stale. Run 'npm ci && npm run build' in web/ and commit the result."
            exit 1
          fi
          echo "committed bundle matches a fresh build"

  # Real-browser proof that a hostile HTML/SVG artifact preview cannot reach the app (#83).
  # Needs a browser download, so it is its own job and not a required check: a red run here
  # is visible on the PR and must be read, not skipped.
  sandbox-probe:
    name: sandbox probe (real browser)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch chrome-headless-shell
        run: |
          npx --yes @puppeteer/browsers@2 install chrome-headless-shell@stable --path "$RUNNER_TEMP/browsers" | tee "$RUNNER_TEMP/install.txt"
          echo "CHROME=$(awk '{print $2}' "$RUNNER_TEMP/install.txt" | tail -1)" >> "$GITHUB_ENV"
      - name: Probe
        run: node scripts/sandbox-probe.mjs
        working-directory: web

  # These two run from the first commit and never skip: they are the rules in
  # AGENTS.md that can be checked mechanically.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credential-shaped file is tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env|\.env\.[^.e][^/]*|[^/]*\.pem|[^/]*\.key|[^/]*\.p12)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::A credential-shaped file is tracked: $bad"
            echo "Remove it, add it to .gitignore, and rotate the secret."
            exit 1
          fi
          echo "no credential-shaped files tracked"
      - name: Lockfile resolves from the public registry
        run: |
          # A lockfile generated behind a private mirror pins URLs a CI runner cannot reach;
          # npm ci then hangs and dies with "Exit handler never called".
          if [ -f web/package-lock.json ] && grep -E '"resolved": "' web/package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'; then
            echo "::error::web/package-lock.json has a non-public resolved URL. Regenerate it with --registry=https://registry.npmjs.org/."
            exit 1
          fi
          echo "lockfile resolves from registry.npmjs.org"
      - name: Hermes contract guard self-test
        run: python3 -I -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Go build base is supported, pinned and >= go.mod
        run: python3 -I scripts/check_go_base.py
      - name: No Docker socket reference in code
        run: |
          if grep -rn --include='*.go' --include='*.ts' --include='*.tsx' --include='*.js' -E '/var/run/docker\.sock' . ; then
            echo "::error::Antares must never reach the Docker socket (AGENTS.md)."
            exit 1
          fi
          echo "no docker socket references"
      - name: No real secret in .env.example
        run: |
          if [ -f .env.example ] && grep -P '^[A-Z0-9_]+=(?!$|<|changeme|your-|xxx|placeholder)' .env.example | grep -vE '=(true|false|[0-9]+)$'; then
            echo "::error::.env.example appears to carry a real value. It lists names only."
            exit 1
          fi
          echo ".env.example carries no value"
