# Antares. Run from this directory: `ANTARES_TAG=<full-sha> docker compose up -d`.
# Secrets are not in this file: they come from ANTARES_ENV_FILE, outside the repository.
services:
  antares:
    image: ghcr.io/raufimusaddiq/antares:${ANTARES_TAG:?set ANTARES_TAG to a full commit SHA}
    container_name: antares
    restart: unless-stopped
    env_file:
      - ${ANTARES_ENV_FILE:-/opt/antares/antares.env}
    environment:
      ANTARES_ADDR: ":8080"
      ANTARES_DB_PATH: /data/antares.sqlite
    volumes:
      - antares-data:/data
    networks:
      - hermes_edge   # antares -> hermes:8642
      - idx_default   # Caddy -> antares:8080
    # Loopback only, for host-side smoke checks. Caddy does not use it: it runs in a container and
    # reaches antares:8080 over idx_default. Never 0.0.0.0.
    ports:
      - "127.0.0.1:8080:8080"
    # Reaches the host-side provisioner (see hermes-provisioner.service).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/antares", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  antares-data:

networks:
  # The network Hermes is already on, where `hermes:8642` resolves. Created by the Hermes
  # deployment; Antares joins it and never creates or alters it.
  hermes_edge:
    external: true
  # The network Caddy is on, where `antares:8080` resolves for the edge proxy. Owned by the idx
  # stack; Antares joins it and never creates or alters it.
  idx_default:
    external: true
